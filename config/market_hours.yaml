# Market Hours and Timing Configuration
# Korean market specific timing and session management

# Primary Market Sessions
market_sessions:
  kospi:
    timezone: "Asia/Seoul"
    regular_hours:
      start: "09:00"
      end: "15:30"
      lunch_break:
        start: "11:30"
        end: "12:30"

    pre_market:
      enabled: false  # KOSPI doesn't have significant pre-market
      start: "08:00"
      end: "09:00"

    after_market:
      enabled: true
      start: "15:40"   # After-hours trading
      end: "16:00"

  kosdaq:
    timezone: "Asia/Seoul"
    regular_hours:
      start: "09:00"
      end: "15:30"
      lunch_break:
        start: "11:30"
        end: "12:30"

    pre_market:
      enabled: false

    after_market:
      enabled: true
      start: "15:40"
      end: "16:00"

# Trading Windows
trading_windows:
  # Opening Range Window
  opening_range:
    start: "09:00"
    end: "09:30"
    description: "Primary ORB calculation period"

  # Optimal Trading Windows (Linda's recommendations)
  optimal_windows:
    morning_session:
      start: "10:30"
      end: "11:30"
      description: "First optimal trading window"
      confidence_multiplier: 1.2

    afternoon_session:
      start: "14:30"
      end: "15:30"
      description: "Second optimal trading window"
      confidence_multiplier: 1.2

  # Avoid Trading Windows
  avoid_windows:
    market_open:
      start: "09:00"
      end: "09:30"
      description: "Avoid opening volatility"

    lunch_period:
      start: "11:30"
      end: "12:30"
      description: "Market lunch break"

    market_close:
      start: "15:00"
      end: "15:30"
      description: "Avoid closing volatility"

# Special Days and Holidays
special_days:
  market_holidays:
    # Korean national holidays (sample - update annually)
    - "2024-01-01"  # New Year's Day
    - "2024-02-09"  # Lunar New Year's Eve
    - "2024-02-10"  # Lunar New Year
    - "2024-02-11"  # Lunar New Year
    - "2024-02-12"  # Lunar New Year Holiday
    - "2024-03-01"  # Independence Movement Day
    - "2024-05-05"  # Children's Day
    - "2024-05-15"  # Buddha's Birthday
    - "2024-06-06"  # Memorial Day
    - "2024-08-15"  # Liberation Day
    - "2024-09-16"  # Chuseok Eve
    - "2024-09-17"  # Chuseok
    - "2024-09-18"  # Chuseok Holiday
    - "2024-10-03"  # National Foundation Day
    - "2024-10-09"  # Hangeul Day
    - "2024-12-25"  # Christmas Day

  early_close_days:
    # Days with early market close
    - date: "2024-12-24"
      close_time: "13:00"
      description: "Christmas Eve early close"

  half_trading_days:
    # Days with reduced trading
    - date: "2024-12-31"
      start: "09:00"
      end: "13:00"
      description: "New Year's Eve half day"

# Session-Specific Strategy Settings
session_strategies:
  opening_session:
    timeframe: "09:00-10:30"
    preferred_strategies:
      - "enhanced_orb"
      - "gap_fade"
    risk_multiplier: 0.8  # Reduce risk during volatile opening

  morning_session:
    timeframe: "10:30-11:30"
    preferred_strategies:
      - "holy_grail"
      - "volatility_breakout"
      - "turtle_soup"
    risk_multiplier: 1.0  # Normal risk

  lunch_session:
    timeframe: "12:30-14:30"
    preferred_strategies:
      - "anti_swing"
    risk_multiplier: 0.6  # Lower risk during quiet period

  afternoon_session:
    timeframe: "14:30-15:30"
    preferred_strategies:
      - "holy_grail"
      - "enhanced_orb"
      - "moving_averages"
    risk_multiplier: 1.0  # Normal risk

  closing_session:
    timeframe: "15:00-15:30"
    preferred_strategies:
      - "gap_fade"  # Only for mean reversion
    risk_multiplier: 0.5  # Very low risk near close

# Time-Based Filters
time_filters:
  minimum_time_between_signals: 30  # 30 minutes between signals

  cooldown_periods:
    after_stop_loss: 60      # 60 minutes after stop loss
    after_large_move: 120    # 2 hours after large market move

  momentum_windows:
    short_term: 15    # 15 minutes for intraday momentum
    medium_term: 60   # 1 hour for session momentum
    long_term: 240    # 4 hours for daily momentum

# Global Market Influence
global_market_timing:
  # Consider overnight moves from other markets
  us_market_close:
    time: "06:30"  # 6:30 AM KST (US close at 4:30 PM EST)
    influence_window: 60  # 1 hour influence period

  europe_market_open:
    time: "17:00"  # 5:00 PM KST (Europe open at 9:00 AM CET)
    influence_window: 120  # 2 hour influence period

  china_market_correlation:
    monitor_shanghai: true
    monitor_shenzhen: true
    correlation_threshold: 0.7

# Weekend and Extended Hours
extended_hours:
  weekend_analysis: true
  weekend_preparation_time: "Sunday 20:00"

  sunday_night_futures:
    monitor: false  # Korean futures don't trade Sunday nights

  holiday_preparation:
    analyze_day_before: true
    special_risk_management: true

# Daylight Saving Time Adjustments
dst_adjustments:
  # Korean time doesn't change, but track global market shifts
  track_us_dst: true
  track_europe_dst: true
  auto_adjust_correlation_windows: true